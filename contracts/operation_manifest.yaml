          "schema": {
            "type": "array",
            "maxItems": 100
          }
        }
      ],
      "outputs": [
        {
          "name": "sources",
          "value_type": "json"
        },
        {
          "name": "context",
          "value_type": "text"
        },
        {
          "name": "answerable",
          "value_type": "boolean"
        }
      ],
      "result_fields": [
        "result.sources",
        "result.context",
        "result.answerable"
      ],
      "error_codes": [
