{
  "operations": [
    {
      "operation_id": "get_document",
      "display_name": "Read a document by ID",
      "description": "Read one document by its exact ID, returning only explicitly selected source fields.",
      "operation_kind": "action",
      "workflow_visible": true,
      "connection_type_ids": [
        "solr"
      ],
      "category": "data",
      "inputs": [
        {
          "name": "connection_ref",
          "value_type": "connection_ref",
          "required": true,
          "display_name": "Project connection"
        },
        {
          "name": "collection",
          "value_type": "text",
          "required": true,
          "display_name": "Collection name"
        },
        {
          "name": "document_id",
          "value_type": "text",
          "required": true,
          "display_name": "Document ID"
        },
        {
          "name": "source_fields",
          "value_type": "json",
          "required": true,
          "display_name": "Source fields to return (JSON)",
          "schema": {
            "type": "array",
            "maxItems": 100
          }
        }
      ],
      "outputs": [
        {
          "name": "documents",
          "value_type": "json"
        },
        {
          "name": "count",
          "value_type": "integer"
        },
        {
          "name": "found",
          "value_type": "boolean"
        },
        {
          "name": "applied",
          "value_type": "boolean"
        }
      ],
      "result_fields": [
        "result.documents",
        "result.count",
        "result.found",
        "result.applied"
      ],
      "error_codes": [
        "invalid_payload",
        "invalid_connection",
        "effect_claim_required",
        "test_mode_suppressed",
        "authentication_failed",
        "provider_unavailable",
        "invalid_provider_response",
        "response_too_large",
        "network_blocked",
        "timeout",
        "not_found",
        "unsupported_vector_mapping"
      ]
    },
