    {
      "operation_id": "prepare_sources",
      "display_name": "RAG: Build cited context from search results",
      "description": "Turn retrieved documents into bounded excerpts labeled S1, S2 and so on for an answer model. Pass the context to the model and retain sources for citation validation; this step does not generate an answer.",
      "operation_kind": "action",
      "workflow_visible": true,
      "connection_type_ids": [],
      "category": "data",
      "inputs": [
        {
          "name": "documents",
          "value_type": "json",
          "required": true,
