{
  "workflow_id": "solr_ingest_chunk",
  "version": "1.0.0",
  "display_name": "Apache Solr Ingest Chunk",
  "description": "Apache Solr explicit-collection workflow. Select the project connection before execution. Embeddings are supplied by the caller from the same model used for collectioning.",
  "enabled": true,
  "trigger": {
    "confidence_threshold": 0.0
  },
  "settings": {
    "execution_graph": {
      "schema_version": 1,
      "entry": {
        "kind": "step",
        "id": "prepare_chunk"
      },
      "edges": [
        {
          "source": {
            "kind": "step",
            "id": "prepare_chunk"
          },
          "outcome": {
            "name": "success"
          },
          "target": {
            "kind": "step",
            "id": "upsert_document"
          },
          "rework": false
        },
        {
          "source": {
            "kind": "step",
            "id": "upsert_document"
          },
          "outcome": {
            "name": "success"
          },
          "target": {
            "kind": "step",
            "id": "done"
          },
          "rework": false
        }
      ]
    },
    "callable": {
      "enabled": true,
      "trigger_channels": [
        "ui",
        "api",
        "mcp"
      ],
      "input_mode": "fields",
      "strict_inputs": true,
      "expected_inputs": [
        {
          "name": "collection",
          "type": "text",
          "required": true,
          "description": "Collection"
        },
        {
          "name": "document_id",
          "type": "text",
          "required": true,
          "description": "Document Id"
        },
        {
          "name": "chunk_id",
          "type": "text",
          "required": true,
          "description": "Chunk Id"
        },
        {
          "name": "text",
          "type": "paragraph",
          "required": true,
          "description": "Text"
        },
        {
          "name": "source_uri",
          "type": "text",
          "required": true,
          "description": "Source Uri"
        },
        {
          "name": "title",
          "type": "text",
          "required": true,
          "description": "Title"
        },
        {
          "name": "vector",
          "type": "array",
          "required": true,
          "description": "Vector"
        }
      ],
      "output_mode": "variables",
      "expected_outputs": [
        {
          "name": "physical_id",
          "type": "text",
          "required": false,
          "description": "Physical Id"
        },
        {
          "name": "applied",
          "type": "boolean",
          "required": false,
          "description": "Applied"
        }
      ],
      "expected_artifacts": [],
      "side_effects": [
        "external_write"
      ]
    }
  },
  "tags": [
    "solr",
    "rag"
  ],
  "steps": [
    {
      "step_id": "prepare_chunk",
      "display_name": "Prepare Chunk",
      "step_kind": "connector",
      "connector_id": "solr.prepare_chunk",
      "connector_install_id": "solr",
      "override": {
        "connector": {
          "extension_id": "flowsteward.solr",
          "action_id": "prepare_chunk"
        }
      },
      "input_mapping_jsonb": {
        "document_id": "state.inputs.document_id",
        "chunk_id": "state.inputs.chunk_id",
        "text": "state.inputs.text",
        "source_uri": "state.inputs.source_uri",
        "title": "state.inputs.title",
        "vector": "state.inputs.vector"
      },
      "output_mapping_jsonb": {
        "document_id": "state.physical_id",
        "document": "state.document"
      }
    },
    {
      "step_id": "upsert_document",
      "display_name": "Upsert Document",
      "step_kind": "connector",
      "connector_id": "solr.upsert_document",
      "connector_install_id": "solr",
      "override": {
        "connector": {
          "extension_id": "flowsteward.solr",
          "action_id": "upsert_document"
        }
      },
      "input_mapping_jsonb": {
        "collection": "state.inputs.collection",
        "document_id": "state.physical_id",
        "document": "state.document"
      },
      "output_mapping_jsonb": {
        "applied": "state.applied"
      },
      "connection_binding_jsonb": {}
    },
    {
      "step_id": "done",
      "display_name": "Done",
      "step_kind": "stop_success",
      "override": {
        "stop_success": {
          "message": "Completed."
        }
      }
    }
  ],
  "groups": []
}
