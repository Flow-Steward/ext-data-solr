          "name": "query_vector",
          "type": "array",
          "required": true
        },
        {
          "name": "k",
          "type": "integer",
          "required": false
        },
        {
          "name": "filter",
          "type": "object",
          "required": false
        },
        {
          "name": "source_fields",
          "type": "array",
          "required": true
