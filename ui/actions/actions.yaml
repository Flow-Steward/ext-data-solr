        "extension:invoke"
      ],
      "handler": {
        "mode": "extension"
      },
      "parameters": [
        {
          "name": "connection_ref",
          "type": "string",
          "required": true
        },
        {
          "name": "collection",
          "type": "string",
          "required": true
        },
        {
          "name": "document_id",
          "type": "string",
          "required": true
        },
        {
          "name": "source_fields",
          "type": "array",
          "required": true
        }
      ],
      "result_fields": [
        "result.documents",
        "result.count",
        "result.found",
        "result.applied"
