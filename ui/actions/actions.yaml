    {
      "action_id": "prepare_chunk",
      "workflow_visible": true,
      "title": "RAG: Prepare a text fragment for indexing",
      "description": "Build a document with text, source details and a supplied embedding, plus a stable physical ID derived from document and fragment IDs. Pass both outputs to Create or replace a complete document; this step does not write or generate embeddings.",
      "required_scopes": [
        "extension:invoke"
      ],
      "handler": {
        "mode": "extension"
      },
      "parameters": [
        {
          "name": "document_id",
          "type": "string",
          "required": true
        },
        {
          "name": "chunk_id",
          "type": "string",
          "required": true
        },
        {
          "name": "text",
          "type": "string",
          "required": true
        },
        {
          "name": "source_uri",
          "type": "string",
          "required": true
        },
        {
          "name": "title",
          "type": "string",
          "required": true
        },
        {
          "name": "vector",
          "type": "array",
          "required": true
        }
      ],
      "result_fields": [
        "result.document_id",
        "result.document"
      ],
      "error_codes": [
        "invalid_payload"
      ]
    },
    {
      "action_id": "prepare_sources",
      "workflow_visible": true,
      "title": "RAG: Build cited context from search results",
      "description": "Turn retrieved documents into bounded excerpts labeled S1, S2 and so on for an answer model. Pass the context to the model and retain sources for citation validation; this step does not generate an answer.",
      "required_scopes": [
        "extension:invoke"
      ],
      "handler": {
        "mode": "extension"
      },
      "parameters": [
        {
          "name": "documents",
          "type": "array",
          "required": true
        }
      ],
      "result_fields": [
        "result.sources",
        "result.context",
        "result.answerable"
      ],
      "error_codes": [
        "invalid_payload"
      ]
    },
    {
      "action_id": "finalize_answer",
      "workflow_visible": true,
      "title": "RAG: Validate answer citation IDs",
      "description": "Check that answer markers such as [S1] match the cited IDs and supplied sources. Returns a fixed abstention when no evidence exists; checks citation syntax, not whether the answer follows from the text.",
      "required_scopes": [
        "extension:invoke"
      ],
      "handler": {
        "mode": "extension"
      },
      "parameters": [
        {
          "name": "answer",
          "type": "string",
          "required": true
        },
        {
          "name": "cited_source_ids",
          "type": "array",
          "required": true
        },
        {
          "name": "sources",
          "type": "array",
          "required": true
        },
        {
          "name": "abstained",
          "type": "boolean",
          "required": false
        }
      ],
      "result_fields": [
        "result.answer",
        "result.sources",
        "result.grounded",
        "result.abstained",
        "result.citation_count"
      ],
      "error_codes": [
        "invalid_payload"
      ]
    },
